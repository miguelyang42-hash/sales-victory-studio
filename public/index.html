<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>销售战报中心 · 战报生成器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #dfe2e7;
      --panel: #f7f8fa;
      --ink: #15171b;
      --muted: #646b77;
      --line: #d5d9df;
      --red: #ad1117;
      --red-deep: #7d0b10;
      --gold: #d5ac58;
      --focus: #1677ff;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid rgba(22, 119, 255, 0.28);
      outline-offset: 2px;
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 24px;
      border-bottom: 1px solid #292d34;
      background: #111318;
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      margin-right: 11px;
      border-radius: 7px;
      border: 1px solid #d2a64f;
      background: #a90f15;
      color: #fff7df;
      font-size: 18px;
      font-weight: 900;
    }

    .brand-mark img {
      display: block;
      width: 28px;
      height: 22px;
      object-fit: contain;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy strong {
      display: block;
      color: #f5f6f8;
      font-size: 16px;
      line-height: 1.2;
    }

    .brand-copy span {
      display: block;
      margin-top: 3px;
      color: #9ea5b1;
      font-size: 12px;
      line-height: 1.2;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      flex: 0 0 auto;
    }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(320px, 376px) minmax(0, 1fr);
      height: calc(100vh - 64px);
      min-height: 680px;
    }

    .control-panel {
      overflow-y: auto;
      padding: 22px 20px 28px;
      border-right: 1px solid #cdd1d8;
      background: var(--panel);
    }

    .panel-title {
      margin: 0 0 5px;
      font-size: 20px;
      line-height: 1.4;
    }

    .panel-subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .field-group {
      margin: 0 0 22px;
      padding: 0 0 22px;
      border: 0;
      border-bottom: 1px solid #e0e3e8;
    }

    .field-label,
    .field-group legend {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 0;
      font-size: 13px;
      font-weight: 800;
      color: #343943;
    }

    .employee-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .employee-option {
      position: relative;
      min-width: 0;
      padding: 4px 4px 7px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: #30343b;
      text-align: center;
      transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }

    .employee-option:hover {
      border-color: #bdc3cc;
      transform: translateY(-1px);
    }

    .employee-option.is-active {
      border-color: var(--red);
      box-shadow: 0 0 0 2px rgba(173, 17, 23, 0.12), 0 8px 18px rgba(23, 27, 34, 0.08);
      color: var(--red-deep);
    }

    .employee-option img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      margin-bottom: 6px;
      border-radius: 5px;
      object-fit: cover;
      object-position: center 24%;
      background: #e9ebee;
    }

    .employee-option span {
      display: block;
      overflow: hidden;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
      text-overflow: ellipsis;
    }

    .input-shell {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      align-items: center;
      min-height: 48px;
      border: 1px solid #cfd4db;
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
    }

    .input-prefix {
      display: grid;
      place-items: center;
      align-self: stretch;
      border-right: 1px solid var(--line);
      background: #f6f7f9;
      color: #4d545f;
      font-size: 13px;
      font-weight: 900;
    }

    .input-shell input {
      width: 100%;
      min-width: 0;
      height: 46px;
      padding: 0 13px;
      border: 0;
      outline: 0;
      color: #17191d;
      font-size: 18px;
      font-weight: 800;
    }

    .currency-amount {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 8px;
    }

    .currency-segment {
      grid-template-columns: repeat(2, 1fr);
      align-self: stretch;
    }

    .amount-only {
      grid-template-columns: minmax(0, 1fr);
    }

    .date-input {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      border: 1px solid #cfd4db;
      border-radius: var(--radius);
      background: #fff;
      color: #20242b;
      font-size: 14px;
      font-weight: 700;
    }

    .segment {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #e9ecf0;
    }

    .segment button {
      min-height: 38px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #5d6470;
      font-size: 13px;
      font-weight: 800;
    }

    .segment button.is-active {
      background: #fff;
      color: var(--red-deep);
      box-shadow: 0 1px 4px rgba(19, 25, 34, 0.12);
    }

    .segment-three {
      grid-template-columns: repeat(3, 1fr);
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .theme-option {
      min-width: 0;
      min-height: 84px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: #4e5560;
      font-size: 11px;
      font-weight: 800;
      text-align: left;
    }

    .theme-option.is-active {
      border-color: var(--red);
      color: var(--red-deep);
      box-shadow: 0 0 0 2px rgba(173, 17, 23, 0.1);
    }

    .theme-preview {
      display: block;
      width: 100%;
      aspect-ratio: 2.2 / 1;
      margin: 0 0 6px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 4px;
      background-position: center;
      background-size: cover;
      box-shadow: 0 0 0 1px rgba(26, 29, 34, 0.18);
    }

    .theme-name {
      display: block;
      overflow: hidden;
      padding: 0 2px 1px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .upload-zone {
      position: relative;
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      min-height: 76px;
      padding: 12px;
      border: 1px dashed #b9c0ca;
      border-radius: var(--radius);
      background: #ffffff;
      transition: border-color 140ms ease, background 140ms ease;
      cursor: pointer;
    }

    .upload-zone:hover,
    .upload-zone.is-dragging {
      border-color: var(--red);
      background: #fff9f7;
    }

    .upload-zone.has-file {
      border-style: solid;
      border-color: #b9cdbd;
      background: #f8fcf8;
    }

    .upload-zone input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .upload-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 7px;
      background: #eceff3;
      color: #424852;
      font-size: 22px;
      font-weight: 400;
    }

    .upload-copy {
      min-width: 0;
    }

    .upload-copy strong,
    .upload-copy span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .upload-copy strong {
      color: #30343b;
      font-size: 13px;
    }

    .upload-copy span {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .upload-action {
      color: var(--red);
      font-size: 12px;
      font-weight: 800;
    }

    .action-stack {
      display: grid;
      gap: 9px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 900;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary {
      background: #ad1117;
      color: #fff;
      box-shadow: 0 5px 12px rgba(139, 23, 18, 0.2);
    }

    .btn-primary:hover {
      background: #9f1914;
    }

    .btn-secondary {
      border-color: #cfd4da;
      background: #fff;
      color: #30343b;
    }

    .btn-ghost {
      border-color: transparent;
      background: transparent;
      color: #5f6671;
    }

    .top-actions .btn-ghost {
      color: #d8dce3;
    }

    .top-actions .btn-secondary {
      border-color: #3a3f48;
      background: #202329;
      color: #f0f2f5;
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.48;
      box-shadow: none;
    }

    .btn-icon {
      width: 16px;
      font-size: 17px;
      font-weight: 400;
      line-height: 1;
    }

    .preview-panel {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: #15171b;
    }

    .preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 48px;
      padding: 7px 16px;
      border-bottom: 1px solid #30343b;
      color: #edf0f4;
      background: #101216;
    }

    .preview-label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 12px;
      font-weight: 800;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #50b86b;
      box-shadow: 0 0 0 3px rgba(80, 184, 107, 0.15);
    }

    .preview-meta {
      color: #969eaa;
      font-size: 11px;
      white-space: nowrap;
    }

    .canvas-stage {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: auto;
      padding: 22px;
    }

    .canvas-wrap {
      width: min(100%, calc((100vh - 156px) * 0.9124));
      min-width: 280px;
      aspect-ratio: 1198 / 1313;
      border: 1px solid rgba(222, 178, 83, 0.58);
      background: #260306;
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.46), 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10;
      max-width: calc(100vw - 32px);
      padding: 10px 14px;
      border-radius: 7px;
      background: #17191d;
      color: #fff;
      font-size: 13px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.24);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 900px) {
      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        height: 58px;
        padding: 0 14px;
      }

      .brand-copy span,
      .top-actions .btn-secondary {
        display: none;
      }

      .app-shell {
        display: flex;
        height: auto;
        min-height: 0;
        flex-direction: column;
      }

      .control-panel {
        overflow: visible;
        padding: 18px 14px 22px;
        border-right: 0;
        border-bottom: 1px solid #d9dde3;
      }

      .employee-grid {
        gap: 7px;
      }

      .preview-panel {
        min-height: 720px;
      }

      .canvas-stage {
        align-items: start;
        padding: 14px;
      }

      .canvas-wrap {
        width: min(100%, 590px);
      }
    }

    @media (max-width: 470px) {
      .top-actions #resetButton {
        display: none;
      }

      .panel-title {
        font-size: 18px;
      }

      .preview-panel {
        min-height: 610px;
      }

      .preview-meta {
        display: none;
      }

      .canvas-stage {
        padding: 10px;
      }
    }

    /* Apple-inspired light blue glass workspace */
    :root {
      --bg: #eaf4fb;
      --panel: rgba(250, 253, 255, 0.72);
      --ink: #14243a;
      --muted: #64758a;
      --line: rgba(115, 157, 190, 0.26);
      --red: #0a84ff;
      --red-deep: #075fb8;
      --focus: #0a84ff;
      --radius: 14px;
      --glass: rgba(250, 253, 255, 0.7);
      --glass-strong: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(255, 255, 255, 0.82);
      --soft-blue: rgba(221, 240, 252, 0.78);
      --shadow: 0 24px 60px rgba(58, 104, 139, 0.16), 0 2px 10px rgba(45, 88, 121, 0.07);
    }

    html,
    body {
      height: 100%;
      background:
        linear-gradient(145deg, rgba(205, 234, 250, 0.96) 0%, rgba(244, 249, 253, 0.98) 48%, rgba(216, 239, 250, 0.96) 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    input {
      letter-spacing: 0;
    }

    button:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid rgba(10, 132, 255, 0.24);
      outline-offset: 2px;
    }

    .topbar {
      position: relative;
      z-index: 10;
      height: 76px;
      padding: 0 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.88);
      background: rgba(245, 251, 255, 0.68);
      box-shadow: 0 10px 34px rgba(67, 112, 146, 0.1);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
      backdrop-filter: blur(28px) saturate(150%);
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      margin-right: 12px;
      border: 1px solid rgba(255, 255, 255, 0.96);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.82);
      font-size: 20px;
      box-shadow: 0 9px 24px rgba(45, 91, 124, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.78);
    }

    .brand-mark img {
      width: 31px;
      height: 24px;
    }

    .brand-copy strong {
      color: #14243a;
      font-size: 17px;
      font-weight: 780;
    }

    .brand-copy span {
      margin-top: 4px;
      color: #6c8197;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.06em;
    }

    .top-actions {
      gap: 9px;
    }

    .app-shell {
      grid-template-columns: minmax(350px, 398px) minmax(0, 1fr);
      gap: 16px;
      height: calc(100dvh - 76px);
      min-height: 0;
      padding: 16px;
    }

    .control-panel,
    .preview-panel {
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      background: var(--glass);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.72);
      -webkit-backdrop-filter: blur(28px) saturate(145%);
      backdrop-filter: blur(28px) saturate(145%);
    }

    .control-panel {
      padding: 25px 22px 30px;
      border-right: 1px solid var(--glass-border);
      scrollbar-color: rgba(91, 139, 176, 0.36) transparent;
      scrollbar-width: thin;
    }

    .control-panel::-webkit-scrollbar {
      width: 8px;
    }

    .control-panel::-webkit-scrollbar-track {
      background: transparent;
    }

    .control-panel::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 99px;
      background: rgba(91, 139, 176, 0.34);
      background-clip: padding-box;
    }

    .panel-title {
      margin-bottom: 6px;
      color: #10243e;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .panel-subtitle {
      margin-bottom: 25px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .field-group {
      margin-bottom: 22px;
      padding-bottom: 22px;
      border-bottom: 1px solid rgba(111, 151, 182, 0.17);
    }

    .field-label,
    .field-group legend {
      margin-bottom: 11px;
      color: #30465e;
      font-size: 13px;
      font-weight: 760;
    }

    .employee-grid {
      gap: 9px;
    }

    .employee-option {
      padding: 5px 5px 9px;
      border: 1px solid rgba(129, 166, 194, 0.25);
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.62);
      color: #40556b;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease, background 160ms ease;
    }

    .employee-option:hover {
      border-color: rgba(10, 132, 255, 0.38);
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 9px 22px rgba(69, 118, 155, 0.12);
      transform: translateY(-2px);
    }

    .employee-option.is-active {
      border-color: rgba(10, 132, 255, 0.78);
      background: rgba(232, 246, 255, 0.94);
      color: #0565c4;
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.12), 0 12px 26px rgba(10, 105, 194, 0.16), inset 0 1px 0 #fff;
    }

    .employee-option img {
      margin-bottom: 7px;
      border-radius: 11px;
      background: #e7f0f6;
      box-shadow: 0 5px 14px rgba(47, 78, 105, 0.1);
    }

    .employee-option span {
      color: inherit;
      font-weight: 760;
    }

    .input-shell,
    .date-input {
      border: 1px solid rgba(121, 161, 191, 0.3);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.92), 0 7px 18px rgba(72, 112, 143, 0.07);
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .input-shell:focus-within,
    .date-input:focus {
      border-color: rgba(10, 132, 255, 0.68);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.11), 0 9px 24px rgba(41, 111, 169, 0.1);
    }

    .input-prefix {
      border-right: 1px solid rgba(121, 161, 191, 0.22);
      background: rgba(224, 240, 250, 0.72);
      color: #40647f;
    }

    .input-shell input {
      background: transparent;
      color: #14243a;
    }

    .date-input {
      color: #263b52;
    }

    .rmb-conversion {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      margin-top: 9px;
      padding: 11px 12px 23px;
      border: 1px solid rgba(10, 132, 255, 0.16);
      border-radius: 14px;
      background: rgba(228, 244, 254, 0.68);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .rmb-conversion div {
      min-width: 0;
    }

    .rmb-conversion span,
    .rmb-conversion strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rmb-conversion span {
      margin-bottom: 3px;
      color: #698098;
      font-size: 10px;
      font-weight: 750;
    }

    .rmb-conversion strong {
      color: #0768c7;
      font-size: 15px;
      font-weight: 820;
    }

    .rmb-conversion small {
      position: absolute;
      right: 12px;
      bottom: 6px;
      color: #72889d;
      font-size: 9px;
      font-weight: 700;
    }

    .segment {
      gap: 4px;
      padding: 4px;
      border: 1px solid rgba(121, 161, 191, 0.22);
      border-radius: 14px;
      background: rgba(205, 226, 239, 0.5);
      box-shadow: inset 0 1px 2px rgba(84, 126, 158, 0.06);
    }

    .segment button {
      border-radius: 10px;
      color: #62758a;
      font-weight: 750;
      transition: color 150ms ease, background 150ms ease, box-shadow 150ms ease, transform 150ms ease;
    }

    .segment button:hover {
      color: #216da9;
    }

    .segment button.is-active {
      background: rgba(255, 255, 255, 0.94);
      color: #0767c7;
      box-shadow: 0 5px 15px rgba(60, 108, 146, 0.13), inset 0 1px 0 #fff;
    }

    .theme-grid {
      gap: 10px;
    }

    .theme-option {
      min-height: 91px;
      padding: 6px 6px 8px;

<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">

    <div class="top-actions">

        <span class="btn-icon" aria-hidden="true">↓</span>
        下载 PNG
      </button>
    </div>
  </header>

  <main class="app-shell">
    <aside class="control-panel">
      <h1 class="panel-title">生成开单战报</h1>
      <p class="panel-subtitle">选择出单英雄并填写开单信息，右侧会实时生成可分享的高清战报。</p>

      <fieldset class="field-group">
        <legend>出单英雄</legend>
        <div class="employee-grid" id="employeeGrid">
          <button class="employee-option is-active" type="button" data-employee="sample" aria-pressed="true">
            <img src="assets/placeholder-avatar.png" alt="示例员工">
            <span>示例员工</span>
          </button>
        </div>
      </fieldset>

      <div class="field-group">
        <label class="field-label" for="amountInput">开单金额</label>
        <div class="currency-amount">
          <div class="segment currency-segment" id="currencySegment">
            <button class="is-active" type="button" data-currency="USD" aria-pressed="true">USD</button>
            <button type="button" data-currency="RMB" aria-pressed="false">RMB</button>
          </div>
          <div class="input-shell amount-only">
            <input id="amountInput" type="text" inputmode="decimal" value="100.00" maxlength="16" autocomplete="off" aria-label="开单金额">
          </div>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="cumulativeInput">累积金额</label>

          <div class="segment currency-segment" id="cumulativeCurrencySegment">
            <button class="is-active" type="button" data-currency="USD" aria-pressed="true">USD</button>
            <button type="button" data-currency="RMB" aria-pressed="false">RMB</button>
          </div>
          <div class="input-shell amount-only">
            <input id="cumulativeInput" type="text" inputmode="decimal" value="100.00" maxlength="16" autocomplete="off" aria-label="累积金额">
          </div>
        </div>
        <div class="rmb-conversion" id="rmbConversion" aria-live="polite">

            <strong id="convertedAmount">¥670.00</strong>

          <div>
            <span>累积人民币</span>
            <strong id="convertedCumulative">¥670.00</strong>

      </div>

      <fieldset class="field-group">

      <div class="field-group">

          </span>

        </button>
        <button class="btn btn-secondary" id="saveButton" type="button">
          <span class="btn-icon" aria-hidden="true">✓</span>

        </button>

    async function api(url, options = {}) {
      const method = String(options.method || "GET").toUpperCase();
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      if (method !== "GET" && method !== "HEAD") {
        const key = sessionAdminKey();
        if (key) headers["x-admin-key"] = key;
      }
      const response = await fetch(url, { ...options, headers });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || "后台服务请求失败");
      return payload;
    }

    function roundedRectPath(context, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      context.beginPath();
      context.moveTo(x + r, y);
      context.arcTo(x + width, y, x + width, y + height, r);
      context.arcTo(x + width, y + height, x, y + height, r);
      context.arcTo(x, y + height, x, y, r);
      context.arcTo(x, y, x + width, y, r);
      context.closePath();
    }

    function fillRoundedRect(context, x, y, width, height, radius, fillStyle) {
      roundedRectPath(context, x, y, width, height, radius);
      context.fillStyle = fillStyle;
      context.fill();
    }

    function strokeRoundedRect(context, x, y, width, height, radius, strokeStyle, lineWidth) {
      roundedRectPath(context, x, y, width, height, radius);
      context.strokeStyle = strokeStyle;
      context.lineWidth = lineWidth;
      context.stroke();
    }

    function loadImage(src) {
      if (imageCache[src]) return imageCache[src];
      imageCache[src] = new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
      return imageCache[src];
    }

    function coverRect(context, image, x, y, width, height, focusY = 0.5) {
      const scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
      const sourceWidth = width / scale;
      const sourceHeight = height / scale;
      const sourceX = (image.naturalWidth - sourceWidth) / 2;
      const sourceY = Math.max(0, Math.min(image.naturalHeight - sourceHeight, image.naturalHeight * focusY - sourceHeight * 0.45));
      context.drawImage(image, sourceX, sourceY, sourceWidth, sourceHeight, x, y, width, height);
    }

    function calculateContainRect(image, x, y, width, height) {
      const scale = Math.min(width / image.naturalWidth, height / image.naturalHeight);
      const drawWidth = image.naturalWidth * scale;
      const drawHeight = image.naturalHeight * scale;
      const drawX = x + (width - drawWidth) / 2;
      const drawY = y + (height - drawHeight) / 2;
      return { x: drawX, y: drawY, width: drawWidth, height: drawHeight };
    }

    function containRect(context, image, x, y, width, height) {
      const rect = calculateContainRect(image, x, y, width, height);
      context.drawImage(image, rect.x, rect.y, rect.width, rect.height);
      return rect;
    }

    function formatAmount(value) {
      const cleaned = String(value).replace(/,/g, "").replace(/[^0-9.]/g, "");
      const parts = cleaned.split(".");
      const normalized = parts.shift() + (parts.length ? "." + parts.join("").slice(0, 2) : "");
      const number = Number(normalized);
      if (!Number.isFinite(number)) return "0.00";
      return number.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    }

    function drawPortrait(context, portrait, employee) {
      const x = 38;
      const y = 150;
      const width = 350;
      const height = 490;

      context.save();
      context.shadowColor = "rgba(226, 178, 76, 0.38)";
      context.shadowBlur = 26;
      fillRoundedRect(context, x - 4, y - 4, width + 8, height + 8, 11, "#13080a");
      context.shadowColor = "transparent";
      roundedRectPath(context, x, y, width, height, 8);
      context.clip();
      coverRect(context, portrait, x, y, width, height, employee.positionY);

      const sideTint = context.createLinearGradient(x, y, x + width, y);
      sideTint.addColorStop(0, "rgba(10, 4, 7, 0.35)");
      sideTint.addColorStop(0.5, "rgba(10, 4, 7, 0)");
      sideTint.addColorStop(1, "rgba(78, 5, 9, 0.32)");

    function colorWithAlpha(hex, alpha) {
      const normalized = hex.replace("#", "");
      const value = Number.parseInt(normalized.length === 3
        ? normalized.split("").map((character) => character + character).join("")
        : normalized, 16);
      const red = (value >> 16) & 255;
      const green = (value >> 8) & 255;
      const blue = value & 255;
      return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
    }

    function drawUpwardChart(context, width, height, theme, opacity = 0.28) {
      const baseX = width * 0.73;
      const baseY = height * 0.34;
      const barWidth = Math.max(12, width * 0.012);
      const gap = barWidth * 0.72;
      context.save();
      context.globalAlpha = opacity;
      for (let index = 0; index < 7; index += 1) {
        const barHeight = height * (0.045 + index * 0.021);
        const barX = baseX + index * (barWidth + gap);
        const barGradient = context.createLinearGradient(0, baseY - barHeight, 0, baseY);
        barGradient.addColorStop(0, theme.accentLight);
        barGradient.addColorStop(1, theme.accent);
        context.fillStyle = barGradient;
        context.fillRect(barX, baseY - barHeight, barWidth, barHeight);
      }

      context.strokeStyle = theme.accentLight;
      context.lineWidth = Math.max(4, width * 0.004);
      context.lineJoin = "round";
      context.lineCap = "round";
      context.beginPath();
      context.moveTo(baseX - width * 0.015, baseY - height * 0.01);
      context.lineTo(baseX + width * 0.055, baseY - height * 0.075);
      context.lineTo(baseX + width * 0.11, baseY - height * 0.045);
      context.lineTo(baseX + width * 0.185, baseY - height * 0.17);
      context.stroke();
      context.beginPath();
      context.moveTo(baseX + width * 0.157, baseY - height * 0.164);
      context.lineTo(baseX + width * 0.185, baseY - height * 0.17);
      context.lineTo(baseX + width * 0.18, baseY - height * 0.135);
      context.stroke();
      context.restore();
    }

    function drawLaurelWreath(context, centerX, centerY, radius, theme, opacity = 0.34) {
      context.save();
      context.globalAlpha = opacity;
      context.fillStyle = theme.accentLight;
      context.strokeStyle = theme.accent;
      context.lineWidth = Math.max(2, radius * 0.012);
      [-1, 1].forEach((side) => {
        context.beginPath();
        context.moveTo(centerX + side * radius * 0.92, centerY + radius * 0.44);
        context.quadraticCurveTo(
          centerX + side * radius * 1.12,
          centerY - radius * 0.16,
          centerX + side * radius * 0.7,
          centerY - radius * 0.72
        );
        context.stroke();
        for (let index = 0; index < 9; index += 1) {
          const progress = index / 8;
          const x = centerX + side * radius * (0.9 + Math.sin(progress * Math.PI) * 0.17 - progress * 0.2);
          const y = centerY + radius * (0.4 - progress * 1.1);
          context.save();
          context.translate(x, y);
          context.rotate(side * (-0.75 + progress * 0.9));
          context.beginPath();
          context.ellipse(0, 0, radius * 0.11, radius * 0.035, 0, 0, Math.PI * 2);
          context.fill();
          context.restore();
        }
      });
      context.restore();
    }

    function drawTrophy(context, centerX, centerY, size, theme, opacity = 0.18) {
      context.save();
      context.globalAlpha = opacity;
      const trophyGradient = context.createLinearGradient(centerX - size, centerY, centerX + size, centerY);
      trophyGradient.addColorStop(0, theme.accent);
      trophyGradient.addColorStop(0.5, theme.accentLight);
      trophyGradient.addColorStop(1, theme.accent);
      context.fillStyle = trophyGradient;
      context.strokeStyle = theme.accentLight;
      context.lineWidth = Math.max(4, size * 0.035);

      context.beginPath();
      context.moveTo(centerX - size * 0.46, centerY - size * 0.48);
      context.lineTo(centerX + size * 0.46, centerY - size * 0.48);
      context.quadraticCurveTo(centerX + size * 0.38, centerY + size * 0.08, centerX, centerY + size * 0.22);
      context.quadraticCurveTo(centerX - size * 0.38, centerY + size * 0.08, centerX - size * 0.46, centerY - size * 0.48);
      context.fill();

      context.beginPath();
      context.arc(centerX - size * 0.47, centerY - size * 0.18, size * 0.31, Math.PI * 0.52, Math.PI * 1.48);
      context.stroke();
      context.beginPath();
      context.arc(centerX + size * 0.47, centerY - size * 0.18, size * 0.31, -Math.PI * 0.48, Math.PI * 0.48);
      context.stroke();
      context.fillRect(centerX - size * 0.07, centerY + size * 0.18, size * 0.14, size * 0.38);
      fillRoundedRect(context, centerX - size * 0.29, centerY + size * 0.5, size * 0.58, size * 0.12, size * 0.03, trophyGradient);

      context.fillStyle = colorWithAlpha(theme.background[0], 0.78);
      context.beginPath();
      for (let point = 0; point < 10; point += 1) {
        const angle = -Math.PI / 2 + point * Math.PI / 5;
        const radius = point % 2 === 0 ? size * 0.17 : size * 0.075;
        const x = centerX + Math.cos(angle) * radius;
        const y = centerY - size * 0.15 + Math.sin(angle) * radius;
        if (point === 0) context.moveTo(x, y);
        else context.lineTo(x, y);
      }
      context.closePath();
      context.fill();
      context.restore();
    }

    function drawFlameField(context, width, height, theme) {
      context.save();
      const flameGradient = context.createLinearGradient(0, height * 0.32, 0, height);
      flameGradient.addColorStop(0, colorWithAlpha(theme.accentLight, 0.05));
      flameGradient.addColorStop(0.55, colorWithAlpha(theme.accent, 0.28));
      flameGradient.addColorStop(1, colorWithAlpha(theme.plane, 0.58));
      context.fillStyle = flameGradient;
      for (let index = 0; index < 14; index += 1) {
        const baseX = index * width / 13 - width * 0.04;
        const flameWidth = width * (0.06 + (index % 3) * 0.012);
        const flameHeight = height * (0.16 + ((index * 7) % 5) * 0.035);
        const baseY = height * 0.94;
        context.beginPath();
        context.moveTo(baseX - flameWidth * 0.55, baseY);
        context.bezierCurveTo(
          baseX - flameWidth * 0.4,
          baseY - flameHeight * 0.35,
          baseX - flameWidth * 0.05,
          baseY - flameHeight * 0.68,
          baseX + flameWidth * 0.02,
          baseY - flameHeight
        );
        context.bezierCurveTo(
          baseX + flameWidth * 0.48,
          baseY - flameHeight * 0.5,
          baseX + flameWidth * 0.58,
          baseY - flameHeight * 0.22,
          baseX + flameWidth * 0.55,
          baseY
        );
        context.closePath();
        context.fill();
      }
      context.restore();
    }

    function drawRibbonWaves(context, width, height, theme, opacity = 0.32) {
      context.save();
      context.globalAlpha = opacity;
      context.lineCap = "round";
      for (let index = 0; index < 5; index += 1) {
        const y = height * (0.82 + index * 0.022);
        const wave = context.createLinearGradient(0, y, width, y - height * 0.12);
        wave.addColorStop(0, theme.accent);
        wave.addColorStop(0.35, theme.plane);
        wave.addColorStop(0.68, theme.accentLight);
        wave.addColorStop(1, theme.accent);
        context.strokeStyle = wave;
        context.lineWidth = Math.max(5, height * (0.018 - index * 0.002));
        context.beginPath();
        context.moveTo(-width * 0.04, y);
        context.bezierCurveTo(width * 0.24, y - height * 0.18, width * 0.52, y + height * 0.08, width * 1.04, y - height * 0.13);
        context.stroke();
      }
      context.restore();
    }

    function drawTechGrid(context, width, height, theme) {
      context.save();
      context.strokeStyle = colorWithAlpha(theme.accent, 0.12);
      context.lineWidth = 1;
      const grid = Math.max(38, Math.round(width / 28));
      for (let x = 0; x <= width; x += grid) {
        context.beginPath();
        context.moveTo(x, 0);
        context.lineTo(x, height);
        context.stroke();
      }
      for (let y = 0; y <= height; y += grid) {
        context.beginPath();
        context.moveTo(0, y);
        context.lineTo(width, y);
        context.stroke();
      }

      context.strokeStyle = colorWithAlpha(theme.accentLight, 0.34);
      context.fillStyle = colorWithAlpha(theme.accent, 0.68);
      for (let index = 0; index < 24; index += 1) {
        const startX = (index * 173) % width;
        const startY = (index * 97) % Math.round(height * 0.72);
        context.beginPath();
        context.moveTo(startX, startY);
        context.lineTo(startX + 28, startY);
        context.lineTo(startX + 44, startY + (index % 2 === 0 ? 16 : -16));
        context.lineTo(startX + 78, startY + (index % 2 === 0 ? 16 : -16));
        context.stroke();
        context.beginPath();
        context.arc(startX, startY, 3, 0, Math.PI * 2);
        context.fill();
      }

      const skylineBase = height * 0.88;
      for (let index = 0; index < 36; index += 1) {
        const buildingWidth = width / 48;
        const buildingHeight = height * (0.035 + ((index * 31) % 11) * 0.009);
        context.fillStyle = colorWithAlpha(index % 3 === 0 ? theme.accentLight : theme.accent, 0.14 + (index % 4) * 0.025);
        context.fillRect(index * width / 35 - buildingWidth * 0.5, skylineBase - buildingHeight, buildingWidth, buildingHeight);
      }
      context.restore();
    }

    function drawRadialRays(context, width, height, theme, opacity = 0.16) {
      context.save();
      context.globalAlpha = opacity;
      context.translate(width * 0.55, height * 0.72);
      for (let index = 0; index < 28; index += 1) {
        const angle = (Math.PI * 2 * index) / 28;
        context.rotate(angle);
        const ray = context.createLinearGradient(0, 0, width * 0.68, 0);
        ray.addColorStop(0, theme.accentLight);
        ray.addColorStop(1, colorWithAlpha(theme.accent, 0));
        context.fillStyle = ray;
        context.beginPath();
        context.moveTo(0, -height * 0.006);
        context.lineTo(width * 0.68, -height * 0.018);
        context.lineTo(width * 0.68, height * 0.018);
        context.lineTo(0, height * 0.006);
        context.closePath();
        context.fill();
      }
      context.restore();
    }

    function drawAuroraField(context, width, height, theme) {
      context.save();
      const skyGlow = context.createRadialGradient(width * 0.62, height * 0.2, 8, width * 0.62, height * 0.2, width * 0.72);
      skyGlow.addColorStop(0, colorWithAlpha(theme.accentLight, 0.3));
      skyGlow.addColorStop(0.42, colorWithAlpha(theme.accent, 0.12));
      skyGlow.addColorStop(1, colorWithAlpha(theme.accent, 0));
      context.fillStyle = skyGlow;
      context.fillRect(0, 0, width, height * 0.72);

      context.lineCap = "round";
      for (let index = 0; index < 7; index += 1) {
        const y = height * (0.28 + index * 0.082);
        const ribbon = context.createLinearGradient(0, y, width, y - height * 0.16);
        ribbon.addColorStop(0, colorWithAlpha(theme.accent, 0));
        ribbon.addColorStop(0.26, colorWithAlpha(theme.accent, 0.44));
        ribbon.addColorStop(0.58, colorWithAlpha(theme.accentLight, 0.82));
        ribbon.addColorStop(1, colorWithAlpha(theme.accent, 0));
        context.strokeStyle = ribbon;
        context.lineWidth = height * (0.026 - index * 0.0022);
        context.beginPath();
        context.moveTo(-width * 0.08, y + height * 0.06);
        context.bezierCurveTo(width * 0.22, y - height * 0.2, width * 0.52, y + height * 0.16, width * 1.08, y - height * 0.18);
        context.stroke();
      }

      for (let index = 0; index < 56; index += 1) {
        const x = (index * 149) % width;
        const y = (index * 67) % Math.round(height * 0.62);
        const size = 1 + (index % 3);
        context.fillStyle = colorWithAlpha(index % 4 === 0 ? theme.accentLight : theme.accent, 0.25 + (index % 4) * 0.1);
        context.fillRect(x, y, size, size);
      }

      const horizon = context.createLinearGradient(0, height * 0.72, 0, height);
      horizon.addColorStop(0, colorWithAlpha(theme.plane, 0));
      horizon.addColorStop(1, colorWithAlpha(theme.plane, 0.75));
      context.fillStyle = horizon;
      context.fillRect(0, height * 0.68, width, height * 0.32);
      context.restore();
    }

    function drawNebulaField(context, width, height, theme) {
      context.save();
      const haze = context.createRadialGradient(width * 0.72, height * 0.28, 10, width * 0.72, height * 0.28, width * 0.6);
      haze.addColorStop(0, colorWithAlpha(theme.accentLight, 0.3));
      haze.addColorStop(0.38, colorWithAlpha(theme.accent, 0.2));
      haze.addColorStop(1, colorWithAlpha(theme.accent, 0));
      context.fillStyle = haze;
      context.fillRect(0, 0, width, height);

      context.globalAlpha = 0.58;
      context.lineCap = "round";
      for (let index = 0; index < 6; index += 1) {
        const y = height * (0.22 + index * 0.105);
        const band = context.createLinearGradient(0, y, width, y + height * 0.1);
        band.addColorStop(0, colorWithAlpha(theme.accent, 0));
        band.addColorStop(0.35, colorWithAlpha(theme.accent, 0.42));
        band.addColorStop(0.65, colorWithAlpha(theme.accentLight, 0.7));
        band.addColorStop(1, colorWithAlpha(theme.accent, 0));
        context.strokeStyle = band;
        context.lineWidth = height * (0.018 - index * 0.0016);
        context.beginPath();
        context.moveTo(-width * 0.05, y);
        context.bezierCurveTo(width * 0.25, y - height * 0.12, width * 0.62, y + height * 0.18, width * 1.06, y - height * 0.09);
        context.stroke();
      }

      context.globalAlpha = 0.44;
      context.strokeStyle = colorWithAlpha(theme.accentLight, 0.68);
      context.lineWidth = 2;
      [0, 1, 2].forEach((index) => {
        context.beginPath();
        context.ellipse(width * 0.77, height * 0.31, width * (0.16 + index * 0.055), height * (0.055 + index * 0.02), -0.22, 0, Math.PI * 2);
        context.stroke();
      });

      for (let index = 0; index < 72; index += 1) {
        const x = (index * 113) % width;
        const y = (index * 47) % Math.round(height * 0.78);
        const size = index % 8 === 0 ? 3 : 1;
        context.fillStyle = colorWithAlpha(index % 5 === 0 ? theme.accentLight : theme.accent, 0.28 + (index % 3) * 0.12);
        context.fillRect(x, y, size, size);
      }
      context.restore();
    }

    function drawGlacierField(context, width, height, theme) {
      context.save();
      const sheen = context.createLinearGradient(0, 0, width, height);
      sheen.addColorStop(0, colorWithAlpha(theme.accentLight, 0.58));
      sheen.addColorStop(0.5, colorWithAlpha(theme.accentLight, 0.06));
      sheen.addColorStop(1, colorWithAlpha(theme.accent, 0.25));
      context.fillStyle = sheen;
      context.fillRect(0, 0, width, height);

      context.globalAlpha = 0.46;
      for (let index = 0; index < 10; index += 1) {
        const x = width * (0.03 + index * 0.105);
        const top = height * (0.08 + (index % 3) * 0.05);
        const bottom = height * (0.86 - (index % 2) * 0.08);
        context.fillStyle = colorWithAlpha(index % 2 ? theme.accentLight : theme.accent, 0.22);
        context.beginPath();
        context.moveTo(x, top);
        context.lineTo(x + width * 0.08, top + height * 0.1);
        context.lineTo(x + width * 0.04, bottom);
        context.lineTo(x - width * 0.05, bottom - height * 0.12);
        context.closePath();
        context.fill();
      }

      context.globalAlpha = 0.3;
      context.strokeStyle = theme.accentLight;
      context.lineWidth = 2;
      for (let index = 0; index < 9; index += 1) {
        const y = height * (0.12 + index * 0.09);
        context.beginPath();
        context.moveTo(0, y);
        context.lineTo(width, y - height * 0.2);
        context.stroke();
      }

      const halo = context.createRadialGradient(width * 0.53, height * 0.18, 5, width * 0.53, height * 0.18, width * 0.52);
      halo.addColorStop(0, colorWithAlpha(theme.accentLight, 0.5));
      halo.addColorStop(1, colorWithAlpha(theme.accentLight, 0));
      context.globalAlpha = 0.7;
      context.fillStyle = halo;
      context.fillRect(0, 0, width, height * 0.62);
      context.restore();
    }

    function drawRoseField(context, width, height, theme) {
      context.save();
      const diagonal = context.createLinearGradient(0, height, width, 0);
      diagonal.addColorStop(0, colorWithAlpha(theme.accent, 0.08));
      diagonal.addColorStop(0.5, colorWithAlpha(theme.accentLight, 0.2));
      diagonal.addColorStop(1, colorWithAlpha(theme.accent, 0.04));
      context.fillStyle = diagonal;
      context.fillRect(0, 0, width, height);

      context.globalAlpha = 0.36;
      for (let index = 0; index < 9; index += 1) {
        const startX = width * (-0.08 + index * 0.16);
        const band = context.createLinearGradient(startX, height, startX + width * 0.28, 0);
        band.addColorStop(0, colorWithAlpha(theme.accent, 0));
        band.addColorStop(0.5, colorWithAlpha(theme.accentLight, 0.34));
        band.addColorStop(1, colorWithAlpha(theme.accent, 0));
        context.fillStyle = band;
        context.beginPath();
        context.moveTo(startX, height);
        context.lineTo(startX + width * 0.07, height);
        context.lineTo(startX + width * 0.35, 0);
        context.lineTo(startX + width * 0.27, 0);
        context.closePath();
        context.fill();
      }

      context.globalAlpha = 0.52;
      context.strokeStyle = colorWithAlpha(theme.accentLight, 0.78);
      context.lineWidth = 2;
      context.beginPath();
      context.arc(width * 0.82, height * 0.24, width * 0.18, 0.1, Math.PI * 1.35);
      context.stroke();
      context.beginPath();
      context.arc(width * 0.82, height * 0.24, width * 0.24, 0.14, Math.PI * 1.3);
      context.stroke();

      for (let index = 0; index < 20; index += 1) {
        const x = (index * 127) % width;
        const y = (index * 83) % height;
        context.fillStyle = colorWithAlpha(index % 3 === 0 ? theme.accentLight : theme.accent, 0.18 + (index % 3) * 0.1);
        context.fillRect(x, y, 2, 2);
      }
      context.restore();
    }

    function drawTemplateDecorations(context, width, height, theme, layout) {
      if (theme.style === "laurel") {
        drawLaurelWreath(context, layout.title.centerX, layout.title.y - layout.title.size * 0.28, layout.title.size * 1.05, theme, 0.28);
        drawUpwardChart(context, width, height, theme, 0.34);
        drawRibbonWaves(context, width, height, theme, 0.3);
        return;
      }
      if (theme.style === "champion") {
        drawRadialRays(context, width, height, theme, 0.23);
        drawTrophy(context, width * 0.46, height * 0.72, Math.min(width, height) * 0.18, theme, 0.17);
        drawCrown(context, layout.title.centerX, Math.max(30, layout.title.y - layout.title.size * 1.23), layout.title.size * 0.72, theme, 0.72);
        drawUpwardChart(context, width, height, theme, 0.3);
        drawRibbonWaves(context, width, height, theme, 0.42);
        return;
      }
      if (theme.style === "tech") {
        drawTechGrid(context, width, height, theme);
        drawUpwardChart(context, width, height, theme, 0.42);
        return;
      }
      if (theme.style === "luxury") {
        const spotlight = context.createLinearGradient(width, 0, width * 0.38, height * 0.72);
        spotlight.addColorStop(0, colorWithAlpha(theme.accentLight, 0.38));
        spotlight.addColorStop(0.34, colorWithAlpha(theme.accent, 0.1));
        spotlight.addColorStop(1, colorWithAlpha(theme.accent, 0));
        context.fillStyle = spotlight;
        context.fillRect(0, 0, width, height);
        drawLaurelWreath(context, layout.title.centerX, layout.title.y - layout.title.size * 0.3, layout.title.size * 1.08, theme, 0.22);
        drawRibbonWaves(context, width, height, theme, 0.38);
        drawUpwardChart(context, width, height, theme, 0.2);
        return;
      }
      if (theme.style === "flame") {
        drawRadialRays(context, width, height, theme, 0.19);
        drawFlameField(context, width, height, theme);
        drawRibbonWaves(context, width, height, theme, 0.56);
        drawTrophy(context, width * 0.86, height * 0.2, Math.min(width, height) * 0.17, theme, 0.2);
        drawUpwardChart(context, width, height, theme, 0.22);
      }
    }

    function drawPhotoBackground(context, width, height, theme) {
      if (reportBg) {
        coverRect(context, reportBg, 0, 0, width, height, 0.5);
        context.fillStyle = theme.style === "glacier" ? "rgba(255, 255, 255, 0.38)" : "rgba(10, 14, 20, 0.52)";
        context.fillRect(0, 0, width, height);
        return;
      }
      const background = context.createLinearGradient(0, 0, width, height);
      background.addColorStop(0, theme.background[0]);
      background.addColorStop(0.56, theme.background[1]);
      background.addColorStop(1, theme.background[2]);
      context.fillStyle = background;
      context.fillRect(0, 0, width, height);
    }

    function drawPremiumBackground(context, width, height, theme, layout) {
      drawPhotoBackground(context, width, height, theme);

      drawTemplateDecorations(context, width, height, theme, layout);

      const leftShade = context.createLinearGradient(0, 0, layout.leftShadeWidth, 0);
      leftShade.addColorStop(0, colorWithAlpha(theme.panelAlt, 0.96));
      leftShade.addColorStop(0.7, colorWithAlpha(theme.background[0], 0.78));
      leftShade.addColorStop(1, colorWithAlpha(theme.background[0], 0));
      context.fillStyle = leftShade;
      context.fillRect(0, 0, layout.leftShadeWidth + 70, layout.footerY);

      context.save();
      context.beginPath();
      context.moveTo(width * 0.34, 0);
      context.lineTo(width, 0);
      context.lineTo(width, height * 0.5);
      context.lineTo(width * 0.66, height * 0.58);
      context.lineTo(width * 0.35, height * 0.49);
      context.closePath();
      const plane = context.createLinearGradient(width * 0.35, 0, width, height * 0.58);
      plane.addColorStop(0, colorWithAlpha(theme.plane, 0.1));
      plane.addColorStop(0.58, colorWithAlpha(theme.plane, 0.38));
      plane.addColorStop(1, colorWithAlpha(theme.plane, 0.04));
      context.fillStyle = plane;
      context.fill();
      context.restore();

      const glowX = layout.title.centerX;
      const glowY = layout.title.y;
      const glow = context.createRadialGradient(glowX, glowY, 20, glowX, glowY, width * 0.38);
      glow.addColorStop(0, colorWithAlpha(theme.accent, 0.16));
      glow.addColorStop(0.55, colorWithAlpha(theme.accent, 0.05));
      glow.addColorStop(1, colorWithAlpha(theme.accent, 0));
      context.fillStyle = glow;
      context.fillRect(0, 0, width, height);

      context.save();
      context.strokeStyle = colorWithAlpha(theme.accentLight, 0.1);
      context.lineWidth = 1;
      for (let index = 0; index < 7; index += 1) {
        context.beginPath();
        context.moveTo(width - 260 + index * 34, 0);
        context.lineTo(width, 150 + index * 26);
        context.stroke();
        context.beginPath();
        context.moveTo(0, height - 210 + index * 28);
        context.lineTo(220 + index * 34, height);
        context.stroke();
      }
      context.restore();

      context.fillStyle = colorWithAlpha(theme.accentLight, 0.48);
      for (let index = 0; index < 46; index += 1) {
        const x = (index * 197) % width;
        const y = (index * 109) % height;
        const size = index % 11 === 0 ? 2 : 0.8;
        context.fillRect(x, y, size, size);
      }

      context.strokeStyle = colorWithAlpha(theme.accent, 0.72);
      context.lineWidth = 3;
      context.strokeRect(13, 13, width - 26, height - 26);
      context.strokeStyle = colorWithAlpha(theme.accentLight, 0.13);
      context.lineWidth = 1;
      context.strokeRect(22, 22, width - 44, height - 44);
    }

    function drawPremiumTitle(context, title, theme) {
      context.save();
      const gold = context.createLinearGradient(
        title.centerX - title.size * 1.6,
        0,
        title.centerX + title.size * 1.6,
        0
      );
      gold.addColorStop(0, theme.accent);
      gold.addColorStop(0.48, theme.accentLight);
      gold.addColorStop(1, theme.accent);
      context.fillStyle = gold;
      context.textAlign = "center";
      context.shadowColor = "rgba(0, 0, 0, 0.72)";
      context.shadowBlur = 18;
      context.shadowOffsetY = 9;
      context.font = `900 ${title.size}px "STKaiti", "KaiTi", "Microsoft YaHei", serif`;
      context.fillText("星普战报", title.centerX, title.y);
      context.shadowColor = "transparent";
      const englishTitles = {
        laurel: "V I C T O R Y   B U L L E T I N",
        champion: "C H A M P I O N   R E P O R T",
        tech: "P E R F O R M A N C E   U P D A T E",
        luxury: "E L I T E   V I C T O R Y",
        flame: "B A T T L E   R E P O R T"
      };
      context.fillStyle = colorWithAlpha(theme.text, 0.9);
      context.font = '700 22px Arial, sans-serif';
      context.fillText(englishTitles[theme.style] || "V I C T O R Y   R E P O R T", title.centerX, title.englishY);

      const divider = context.createLinearGradient(title.centerX - 330, 0, title.centerX + 330, 0);
      divider.addColorStop(0, colorWithAlpha(theme.accent, 0));
      divider.addColorStop(0.3, colorWithAlpha(theme.accent, 0.72));
      divider.addColorStop(0.7, colorWithAlpha(theme.accent, 0.72));
      divider.addColorStop(1, colorWithAlpha(theme.accent, 0));
      context.fillStyle = divider;
      context.fillRect(title.centerX - 330, title.lineY, 660, 2);

      context.fillStyle = theme.accentLight;
      context.font = '900 40px "STKaiti", "KaiTi", serif';
      context.fillText("剑锋所指，势不可挡！", title.centerX, title.sloganY);
      context.restore();
    }

    function drawPremiumPortrait(context, portrait, employee, rect, theme) {
      const { x, y, width, height } = rect;
      context.save();
      context.shadowColor = colorWithAlpha(theme.accent, 0.3);
      context.shadowBlur = 24;
      fillRoundedRect(context, x - 4, y - 4, width + 8, height + 8, 11, theme.panel);
      context.shadowColor = "transparent";
      roundedRectPath(context, x, y, width, height, 8);
      context.clip();
      coverRect(context, portrait, x, y, width, height, employee.positionY);

      const bottomTint = context.createLinearGradient(x, y + height * 0.62, x, y + height);
      bottomTint.addColorStop(0, "rgba(3, 4, 6, 0)");
      bottomTint.addColorStop(1, colorWithAlpha(theme.panel, 0.96));
      context.fillStyle = bottomTint;
      context.fillRect(x, y + height * 0.55, width, height * 0.45);
      context.restore();
      strokeRoundedRect(context, x, y, width, height, 8, colorWithAlpha(theme.accent, 0.88), 3);
      strokeRoundedRect(context, x + 8, y + 8, width - 16, height - 16, 5, colorWithAlpha(theme.accentLight, 0.13), 1);

      const badgeHeight = Math.max(46, height * 0.12);
      fillRoundedRect(context, x + 16, y + height - badgeHeight - 18, width - 32, badgeHeight, 4, colorWithAlpha(theme.plane, 0.88));
      context.fillStyle = theme.accent;
      context.fillRect(x + width * 0.16, y + height - badgeHeight - 18, width * 0.68, 2);
      context.fillStyle = theme.text;
      context.font = `900 ${Math.max(28, width * 0.1)}px Arial, sans-serif`;
      context.textAlign = "center";
      context.fillText(employee.name, x + width / 2, y + height - badgeHeight * 0.3 - 18);
    }

    function drawPremiumAnnouncement(context, announcement, employeeName, customerType, theme) {
      const { x, y, width } = announcement;
      context.save();
      const panelGradient = context.createLinearGradient(x, y, x + width, y);
      panelGradient.addColorStop(0, colorWithAlpha(theme.panelAlt, 0.9));
      panelGradient.addColorStop(1, colorWithAlpha(theme.panel, 0.42));
      fillRoundedRect(context, x - 14, y - 18, width + 28, 158, 8, panelGradient);
      strokeRoundedRect(context, x - 14, y - 18, width + 28, 158, 8, colorWithAlpha(theme.accent, 0.55), 1.5);
      context.fillStyle = theme.accent;
      context.fillRect(x, y, 4, 126);
      context.textAlign = "left";
      context.fillStyle = colorWithAlpha(theme.text, 0.82);
      context.font = '800 27px "Microsoft YaHei", sans-serif';
      context.fillText("热烈祝贺", x + 24, y + 27);

      let nameSize = width < 500 ? 47 : 54;
      context.fillStyle = theme.accentLight;
      context.font = `900 ${nameSize}px Arial, sans-serif`;
      context.fillText(employeeName, x + 24, y + 84);
      const nameWidth = context.measureText(employeeName).width;
      context.fillStyle = theme.text;
      context.font = `900 ${width < 500 ? 35 : 40}px "Microsoft YaHei", sans-serif`;
      context.fillText("成功开单！", x + 37 + nameWidth, y + 82);

      const lineLabel = customerType === "新客户" ? "新客首单，专业赢得信任" : "老客续单，服务赢得长久";
      context.fillStyle = theme.muted;
      context.font = '700 23px "Microsoft YaHei", sans-serif';
      context.fillText(lineLabel, x + 24, y + 122);
      context.restore();
    }

    function drawPremiumAmount(context, rect, amount, currency, customerType, dateText, theme) {
      const { x, y, width, height } = rect;
      const panelGradient = context.createLinearGradient(x, y, x, y + height);
      panelGradient.addColorStop(0, theme.panelAlt);
      panelGradient.addColorStop(1, theme.panel);
      fillRoundedRect(context, x, y, width, height, 10, panelGradient);
      strokeRoundedRect(context, x, y, width, height, 10, colorWithAlpha(theme.accent, 0.88), 2);
      strokeRoundedRect(context, x + 8, y + 8, width - 16, height - 16, 6, colorWithAlpha(theme.accentLight, 0.1), 1);

      context.save();
      context.textAlign = "center";
      context.fillStyle = theme.text;
      context.font = `900 ${Math.max(28, width * 0.1)}px "Microsoft YaHei", sans-serif`;
      context.fillText("星普战报", x + width / 2, y + height * 0.14);
      context.fillStyle = colorWithAlpha(theme.accent, 0.76);
      context.font = '600 13px Arial, sans-serif';
      context.fillText("SIGNED ORDER", x + width / 2, y + height * 0.21);

      context.fillStyle = theme.muted;
      context.font = `700 ${Math.max(17, width * 0.06)}px "Microsoft YaHei", sans-serif`;
      context.fillText("成功签单金额", x + width / 2, y + height * 0.35);

      const amountText = `${currency} ${amount}`;
      let amountSize = Math.max(38, width * 0.17);
      context.font = `900 ${amountSize}px Arial, sans-serif`;
      while (context.measureText(amountText).width > width - 24 && amountSize > 28) {
        amountSize -= 2;
        context.font = `900 ${amountSize}px Arial, sans-serif`;
      }
      const amountGold = context.createLinearGradient(x + 24, 0, x + width - 24, 0);
      amountGold.addColorStop(0, theme.accent);
      amountGold.addColorStop(0.5, theme.accentLight);
      amountGold.addColorStop(1, theme.accent);
      context.fillStyle = amountGold;
      context.fillText(amountText, x + width / 2, y + height * 0.52);

      const tagWidth = Math.min(width - 80, 150);
      const tagHeight = Math.max(32, height * 0.09);
      fillRoundedRect(context, x + (width - tagWidth) / 2, y + height * 0.58, tagWidth, tagHeight, tagHeight / 2, colorWithAlpha(theme.plane, 0.68));
      strokeRoundedRect(context, x + (width - tagWidth) / 2, y + height * 0.58, tagWidth, tagHeight, tagHeight / 2, colorWithAlpha(theme.accent, 0.66), 1);
      context.fillStyle = theme.text;
      context.font = `800 ${Math.max(16, width * 0.055)}px "Microsoft YaHei", sans-serif`;
      context.fillText(customerType, x + width / 2, y + height * 0.58 + tagHeight * 0.67);

      context.fillStyle = theme.accentLight;
      context.font = `900 ${Math.max(22, width * 0.08)}px "STKaiti", "KaiTi", serif`;
      context.fillText(customerType === "新客户" ? "开局即冲刺" : "信任再续约", x + width / 2, y + height * 0.79);
      context.fillStyle = theme.text;
      context.fillText("我们势不可挡！", x + width / 2, y + height * 0.88);

      context.fillStyle = colorWithAlpha(theme.muted, 0.62);
      context.font = `600 ${Math.max(13, width * 0.043)}px Arial, sans-serif`;
      context.fillText(dateText, x + width / 2, y + height * 0.96);
      context.restore();
    }

    function drawPremiumScreenshot(context, rect, screenshot, fitMode, theme) {
      const { x, y, width, height } = rect;
      fillRoundedRect(context, x, y, width, height, 9, theme.panel);
      strokeRoundedRect(context, x, y, width, height, 9, colorWithAlpha(theme.accent, 0.9), 2);
      strokeRoundedRect(context, x + 8, y + 8, width - 16, height - 16, 6, colorWithAlpha(theme.accentLight, 0.1), 1);

      const innerX = x + 12;
      const innerY = y + 12;
      const innerWidth = width - 24;
      const innerHeight = height - 24;
      context.save();
      roundedRectPath(context, innerX, innerY, innerWidth, innerHeight, 5);
      context.clip();
      const emptyBackground = context.createLinearGradient(innerX, innerY, innerX, innerY + innerHeight);
      emptyBackground.addColorStop(0, theme.panelAlt);
      emptyBackground.addColorStop(1, theme.background[0]);
      context.fillStyle = emptyBackground;
      context.fillRect(innerX, innerY, innerWidth, innerHeight);

      if (screenshot) {
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = "high";
        if (fitMode === "cover") {
          coverRect(context, screenshot, innerX, innerY, innerWidth, innerHeight, 0.5);
          const edgeShade = context.createLinearGradient(innerX, innerY, innerX, innerY + innerHeight);
          edgeShade.addColorStop(0, "rgba(0, 0, 0, 0.04)");
          edgeShade.addColorStop(0.82, "rgba(0, 0, 0, 0.02)");
          edgeShade.addColorStop(1, "rgba(0, 0, 0, 0.18)");

          coverRect(context, screenshot, innerX - 34, innerY - 34, innerWidth + 68, innerHeight + 68, 0.5);

          context.fillStyle = "rgba(2, 3, 5, 0.3)";
          context.fillRect(innerX, innerY, innerWidth, innerHeight);
          const imageRect = calculateContainRect(screenshot, innerX + 14, innerY + 14, innerWidth - 28, innerHeight - 28);
          context.shadowColor = "rgba(0, 0, 0, 0.74)";
          context.shadowBlur = 22;
          context.shadowOffsetY = 7;
          context.drawImage(screenshot, imageRect.x, imageRect.y, imageRect.width, imageRect.height);

    function drawFittedNativeText(context, text, x, y, maxWidth, initialSize, color, align = "center") {
      context.save();
      context.fillStyle = color;
      context.textAlign = align;
      context.textBaseline = "middle";
      let size = initialSize;
      context.font = `900 ${size}px "Microsoft YaHei", Arial, sans-serif`;
      while (context.measureText(text).width > maxWidth && size > 15) {
        size -= 1;
        context.font = `900 ${size}px "Microsoft YaHei", Arial, sans-serif`;
      }
      context.fillText(text, x, y);
      context.restore();
    }

      } else if (theme.style === "tech") {
        drawTechGrid(context, width, height, theme);
        drawUpwardChart(context, width, height, theme, 0.34);
      } else if (theme.style === "luxury") {
        drawRibbonWaves(context, width, height, theme, 0.32);
        drawTrophy(context, width * 0.14, height * 0.77, Math.min(width, height) * 0.1, theme, 0.44);
        drawUpwardChart(context, width, height, theme, 0.2);
      } else if (theme.style === "flame") {
        drawRadialRays(context, width, height, theme, 0.14);
        drawFlameField(context, width, height, theme);
        drawRibbonWaves(context, width, height, theme, 0.34);
      } else if (theme.style === "aurora") {
        drawAuroraField(context, width, height, theme);
        drawRibbonWaves(context, width, height, theme, 0.18);
      } else if (theme.style === "nebula") {
        drawNebulaField(context, width, height, theme);
        drawUpwardChart(context, width, height, theme, 0.16);
      } else if (theme.style === "glacier") {
        drawGlacierField(context, width, height, theme);
        drawUpwardChart(context, width, height, theme, 0.13);
      } else if (theme.style === "rose") {
        drawRoseField(context, width, height, theme);
        drawRibbonWaves(context, width, height, theme, 0.2);
      }

      const glowRadius = Math.min(width, height) * 0.62;
      const glow = context.createRadialGradient(width / 2, height * 0.14, 8, width / 2, height * 0.14, glowRadius);
      glow.addColorStop(0, colorWithAlpha(theme.accentLight, 0.18));
      glow.addColorStop(1, colorWithAlpha(theme.accent, 0));
      context.fillStyle = glow;
      context.fillRect(0, 0, width, height * 0.45);

      context.strokeStyle = colorWithAlpha(theme.accent, 0.88);
      context.lineWidth = 3;
      context.strokeRect(12, 12, width - 24, height - 24);
      context.strokeStyle = colorWithAlpha(theme.accentLight, 0.2);
      context.lineWidth = 1;
      context.strokeRect(22, 22, width - 44, height - 44);
    }

    function drawResponsiveNativeHeader(context, theme, layout, variant) {
      const width = context.canvas.width;
      const centerX = width / 2;
      const portrait = variant === "portrait";
      const titleY = portrait ? 142 : 150;
      const subtitleY = portrait ? 178 : 186;
      const ribbonY = portrait ? 208 : 216;
      const ribbonX = portrait ? 92 : 80;
      const ribbonWidth = width - ribbonX * 2;
      const titleSize = theme.style === "tech" ? (portrait ? 92 : 98) : (portrait ? 112 : 120);
      const ribbonTextSize = portrait ? 30 : 32;

      context.save();
      drawCanvasBrand(context, theme, 46, 28, portrait ? 0.9 : 0.94);

      const titleGradient = context.createLinearGradient(centerX - width * 0.32, 0, centerX + width * 0.32, 0);
      titleGradient.addColorStop(0, theme.accent);
      titleGradient.addColorStop(0.5, theme.accentLight);
      titleGradient.addColorStop(1, theme.accent);
      context.fillStyle = titleGradient;
      context.textAlign = "center";
      context.shadowColor = colorWithAlpha(theme.background[0], 0.82);
      context.shadowBlur = 16;
      context.shadowOffsetY = 6;
      context.font = `900 ${titleSize}px "STKaiti", "KaiTi", "Microsoft YaHei", serif`;
      context.fillText(layout.title, centerX, titleY);
      context.shadowColor = "transparent";

      context.fillStyle = colorWithAlpha(theme.text, 0.92);
      context.font = '800 18px Arial, sans-serif';
      context.fillText(layout.subtitle, centerX, subtitleY);

      const ribbon = context.createLinearGradient(ribbonX, 0, ribbonX + ribbonWidth, 0);
      ribbon.addColorStop(0, colorWithAlpha(theme.header || theme.plane, 0.16));
      ribbon.addColorStop(0.16, colorWithAlpha(layout.header, 0.94));
      ribbon.addColorStop(0.84, colorWithAlpha(layout.header, 0.94));
      ribbon.addColorStop(1, colorWithAlpha(theme.header || theme.plane, 0.16));
      fillRoundedRect(context, ribbonX, ribbonY, ribbonWidth, 54, 7, ribbon);
      strokeRoundedRect(context, ribbonX, ribbonY, ribbonWidth, 54, 7, colorWithAlpha(theme.accent, 0.86), 2);
      context.fillStyle = theme.accentLight;
      context.font = `900 ${ribbonTextSize}px "STKaiti", "KaiTi", "Microsoft YaHei", serif`;
      context.fillText("剑锋所指，势不可挡！", centerX, ribbonY + 37);
      context.restore();
    }

    function drawResponsiveNativeFooter(context, theme) {
      const width = context.canvas.width;
      const height = context.canvas.height;
      const lineY = height - 82;
      context.save();
      const band = context.createLinearGradient(width * 0.12, 0, width * 0.88, 0);
      band.addColorStop(0, colorWithAlpha(theme.accent, 0));
      band.addColorStop(0.2, colorWithAlpha(theme.accent, 0.72));
      band.addColorStop(0.8, colorWithAlpha(theme.accent, 0.72));
      band.addColorStop(1, colorWithAlpha(theme.accent, 0));
      context.fillStyle = band;
      context.fillRect(width * 0.1, lineY, width * 0.8, 2);
      context.textAlign = "center";
      context.fillStyle = colorWithAlpha(theme.text, 0.84);
      context.font = '700 18px "Microsoft YaHei", sans-serif';
      context.fillText("每一次签单，都是专业与信任的共同成果", width / 2, lineY + 28);
      context.fillStyle = theme.style === "glacier" ? theme.accent : theme.accentLight;
      context.font = '900 30px "STKaiti", "KaiTi", serif';
      context.fillText("剑锋所指，势不可挡！", width / 2, lineY + 62);
      context.restore();
    }

    function drawNativeTemplateReport(context, portrait, employee, theme) {
      const layout = nativeTemplateLayouts[theme.style];
      const canvasWidth = context.canvas.width;
      const canvasHeight = context.canvas.height;
      const baseGradient = context.createLinearGradient(0, 0, canvasWidth, canvasHeight);
      baseGradient.addColorStop(0, theme.background[0]);
      baseGradient.addColorStop(0.55, theme.background[1]);
      baseGradient.addColorStop(1, theme.background[2]);
      context.fillStyle = baseGradient;
      context.fillRect(0, 0, canvasWidth, canvasHeight);

      if (state.ratio === "landscape") {
        const scale = Math.min(canvasWidth / 1600, canvasHeight / 900);
        const offsetX = (canvasWidth - 1600 * scale) / 2;
        const offsetY = (canvasHeight - 900 * scale) / 2;
        context.save();
        context.translate(offsetX, offsetY);
        context.scale(scale, scale);
        drawNativeTemplateBackground(context, theme, layout);
        drawNativeTemplateHeader(context, theme, layout);
        drawNativePortraitCard(context, portrait, employee, layout.portrait, theme, layout);
        drawNativeInfoPanel(context, layout.info, employee, theme, layout);
        drawNativeScreenshotCard(context, layout.screenshot, state.screenshot, state.fit, theme, layout);
        drawNativeTemplateFooter(context, theme);
        context.restore();
        return;
      }

      const variant = state.ratio === "portrait" ? "portrait" : "square";
      const responsiveLayout = variant === "portrait"
        ? {
            portrait: { x: (canvasWidth - 420) / 2, y: 300, width: 420, height: 380 },
            info: { x: 60, y: 710, width: canvasWidth - 120, height: 300 },
            screenshot: { x: 60, y: 1040, width: canvasWidth - 120, height: 300 }
          }
        : {
            portrait: { x: 54, y: 300, width: 330, height: 360 },
            info: { x: 414, y: 304, width: canvasWidth - 468, height: 356 },
            screenshot: { x: 54, y: 700, width: canvasWidth - 108, height: 380 }
          };

      context.save();
      drawResponsiveNativeBackground(context, theme, variant);
      drawResponsiveNativeHeader(context, theme, layout, variant);
      drawNativePortraitCard(context, portrait, employee, responsiveLayout.portrait, theme, layout);
      drawNativeInfoPanel(context, responsiveLayout.info, employee, theme, layout);
      drawNativeScreenshotCard(context, responsiveLayout.screenshot, state.screenshot, state.fit, theme, layout);
      drawResponsiveNativeFooter(context, theme);
      context.restore();
    }

    let thumbnailPortrait = null;

    function renderThemeThumbnails() {
      if (!thumbnailPortrait) return;
      const snapshot = {
        employee: state.employee,
        amount: state.amount,
        currency: state.currency,
        customer: state.customer,

        ratio: state.ratio,
        theme: state.theme,

        screenshotName: state.screenshotName
      };
      const previewEmployee = employees[snapshot.employee] || Object.values(employees)[0];
      if (!previewEmployee) return;
      const previewRatio = ratios[snapshot.ratio] || ratios.landscape;
      const previewCanvas = document.createElement("canvas");
      previewCanvas.width = previewRatio.width;
      previewCanvas.height = previewRatio.height;
      const previewContext = previewCanvas.getContext("2d");
      state.employee = snapshot.employee;
      state.amount = snapshot.amount;
      state.currency = snapshot.currency;
      state.customer = snapshot.customer;
      state.date = snapshot.date;
      state.ratio = snapshot.ratio;

      state.screenshot = null;
      state.screenshotName = "";

      themeGrid.querySelectorAll("button[data-theme]").forEach((button) => {
        const theme = themes[button.dataset.theme];

        if (preview) {
          preview.style.backgroundImage = `url("${previewCanvas.toDataURL("image/jpeg", 0.84)}")`;
          preview.classList.add("is-rendered");

      });

      Object.assign(state, snapshot);

    function applyCanvasSettings() {
      const ratio = ratios[state.ratio];
      canvas.width = ratio.width;
      canvas.height = ratio.height;
      canvasWrap.style.aspectRatio = `${ratio.width} / ${ratio.height}`;
      canvasWrap.style.width = `min(100%, calc((100vh - 156px) * ${ratio.width / ratio.height}))`;
      previewMeta.textContent = `${ratio.name}画布 · ${ratio.width} × ${ratio.height} px`;
    }

    function selectRatio(ratioKey) {
      state.ratio = ratioKey;
      ratioSegment.querySelectorAll("button").forEach((button) => {
        const active = button.dataset.ratio === ratioKey;

    async function drawReport() {
      drawQueued = false;
      const employee = employees[state.employee] || Object.values(employees)[0];
      if (!employee) throw new Error("请先在后台添加员工");
      const portrait = await loadImage(employee.src);
      const theme = themes[state.theme];
      if (theme.nativeTemplate) {
        drawNativeTemplateReport(ctx, portrait, employee, theme);
        return;
      }
      const layout = getPremiumLayout(state.ratio);
      drawPremiumBackground(ctx, canvas.width, canvas.height, theme, layout);
      drawPremiumTitle(ctx, layout.title, theme);
      drawPremiumPortrait(ctx, portrait, employee, layout.portrait, theme);
      drawPremiumAnnouncement(ctx, layout.announcement, employee.name, state.customer, theme);
      drawPremiumAmount(
        ctx,
        layout.amount,
        formatRmbAmount(state.amount),
        "RMB",
        state.customer,
        formatReportDate(state.date),
        theme
      );
      drawPremiumScreenshot(ctx, layout.screenshot, state.screenshot, state.fit, theme);
      drawPremiumFooter(ctx, canvas.width, canvas.height, layout.footerY, theme, state.ratio);
    }

    function requestDraw() {
      if (drawQueued) return;
      drawQueued = true;
      const runDraw = () => {
        if (!drawQueued) return;
        drawQueued = false;
        drawReport().catch(() => showToast("图片载入失败，请刷新后重试"));
      };
      window.requestAnimationFrame(runDraw);
      window.setTimeout(runDraw, 80);
    }

    function readImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = reject;
          image.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function handleScreenshot(file) {
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        showToast("请选择图片文件");
        return;
      }
      try {
        state.screenshot = await readImageFile(file);
        state.screenshotName = file.name;
        uploadZone.classList.add("has-file");
        uploadTitle.textContent = "截图已载入";
        uploadHint.textContent = file.name;
        requestDraw();
      } catch {
        showToast("截图读取失败，请换一张图片重试");
      }
    }

    function canvasBlob() {
      return new Promise((resolve, reject) => {
        try {
          canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("empty blob")), "image/png", 1);
        } catch (error) {
          reject(error);
        }
      });
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    async function saveReportRecord(blob) {
      const employee = employees[state.employee] || Object.values(employees)[0];
      const copyText = copyOutput.value || generateOrderCopy();
      return api("/api/reports", {
        method: "POST",
        body: JSON.stringify({
          employeeId: state.employee,
          employeeName: employee?.name || state.employee,
          employeeImage: employee?.src || "",
          amount: state.amount,
          currency: state.currency,
          amountRmb: amountToRmb(state.amount, state.currency),
          cumulativeAmount: state.cumulativeAmount,
          cumulativeCurrency: state.cumulativeCurrency,
          cumulativeRmb: amountToRmb(state.cumulativeAmount || state.amount, state.cumulativeCurrency),
          customer: state.customer,
          reportDate: state.date,
          ratio: state.ratio,
          theme: state.theme,
          screenshotName: state.screenshotName,
          copyText,
          imageData: await blobToDataUrl(blob)
        })
      });
    }

    async function saveReport() {
      try {
        await drawReport();
        const blob = await canvasBlob();
        await saveReportRecord(blob);
        showToast("战报已保存到后台");
      } catch (error) {
        showToast(error.message || "战报保存失败");
      }
    }

    async function saveCopyRecord(copyText) {
      const employee = employees[state.employee] || Object.values(employees)[0];
      return api("/api/copies", {
        method: "POST",
        body: JSON.stringify({
          employeeId: state.employee,
          employeeName: employee?.name || state.employee,
          amountRmb: amountToRmb(state.amount, state.currency),
          cumulativeRmb: amountToRmb(state.cumulativeAmount || state.amount, state.cumulativeCurrency),
          customer: state.customer,
          reportDate: state.date,
          copyText
        })
      });
    }

    async function generateAndSaveCopy() {
      const copyText = generateOrderCopy();
      try {
        await saveCopyRecord(copyText);
        showToast("新文案已生成并保存");
      } catch (error) {
        showToast(error.message || "文案已生成，后台保存失败");
      }
    }

    async function downloadReport() {
      try {
        await drawReport();
        const blob = await canvasBlob();
        const employee = employees[state.employee] || Object.values(employees)[0];
        const link = document.createElement("a");
        const datePart = (state.date || localToday()).replace(/-/g, "");
        link.href = URL.createObjectURL(blob);
        link.download = `销售战报中心战报-${employee?.name || state.employee}-${datePart}.png`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(link.href), 1500);
        try {
          await saveReportRecord(blob);
          showToast("战报已下载并保存到后台");
        } catch {
          showToast("PNG 已下载，后台保存失败");
        }
      } catch (error) {
        showToast(error.message || "导出受浏览器限制，请使用复制图片或换浏览器打开");
      }
    }

    async function copyReport() {
      if (!navigator.clipboard || !window.ClipboardItem) {
        showToast("当前浏览器不支持复制图片，请直接下载 PNG");
        return;
      }
      try {
        await drawReport();
        const blob = await canvasBlob();
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        showToast("战报图片已复制");
      } catch {
        showToast("复制未完成，请使用下载 PNG");
      }
    }

        ? sanitized

        event.preventDefault();
        uploadZone.classList.add("is-dragging");
      });
    });

    ["dragleave", "drop"].forEach((eventName) => {
      uploadZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        uploadZone.classList.remove("is-dragging");
      });
    });

    uploadZone.addEventListener("drop", (event) => handleScreenshot(event.dataTransfer.files[0]));
    document.getElementById("downloadButton").addEventListener("click", downloadReport);
    document.getElementById("downloadTopButton").addEventListener("click", downloadReport);
    document.getElementById("saveButton").addEventListener("click", saveReport);
    document.getElementById("saveTopButton").addEventListener("click", saveReport);
    document.getElementById("copyButton").addEventListener("click", copyReport);
    document.getElementById("copyMobileButton").addEventListener("click", copyReport);
    document.getElementById("resetButton").addEventListener("click", resetForm);
    generateCopyButton.addEventListener("click", generateAndSaveCopy);
    copyTextButton.addEventListener("click", copyOrderCopy);

    dateInput.value = state.date;
    cumulativeInput.value = state.cumulativeAmount;
    updateRmbConversionPreview();
    generateOrderCopy();
    applyCanvasSettings();

    async function initializeApp() {
      renderEmployeeGrid();
      try {
        brandLogo = await loadImage(BRAND_LOGO_SRC);
        reportBg = await loadImage("assets/report-bg.jpg");
        thumbnailPortrait = await loadImage(employees[state.employee].src);
        renderThemeThumbnails();
        requestDraw();
      } catch {
        showToast("员工照片载入失败，请检查 assets 文件夹");
      }
      await refreshEmployees({ silent: true });
    }

    window.addEventListener("focus", () => refreshEmployees({ silent: true }));
    initializeApp();
  </script>
</body>
</html>
