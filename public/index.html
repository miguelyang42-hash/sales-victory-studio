<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Sales Victory Studio 销售战报生成器"><title>销售战报中心 · Sales Victory Studio</title><style>
:root{--bg:#07111f;--panel:#101d30;--line:#243a53;--text:#eef6ff;--muted:#91a5bd;--accent:#45e0be;--gold:#f5c96b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#123759 0,#07111f 42%,#040913 100%);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1500px;margin:auto;padding:20px 24px 50px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#2787d9);display:grid;place-items:center;color:#06121d;font-weight:900;font-size:20px}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:10px;color:var(--text);background:#182b42;border:1px solid var(--line)}.btn.primary{background:linear-gradient(135deg,#38cfae,#247dc7);color:#03131d;font-weight:800}.btn.warn{background:#3a2d16;color:#ffe1a0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:20px}.card{background:linear-gradient(145deg,rgba(18,34,54,.96),rgba(9,20,35,.96));border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 18px 50px #0005}.section{margin-bottom:18px}.section h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}.employees{display:flex;gap:10px;flex-wrap:wrap}.employee{min-width:120px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#0d1a2b;color:var(--text);text-align:left}.employee.active{border-color:var(--accent);box-shadow:0 0 0 2px #45e0be33}.employee small{display:block;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#081625;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:9px;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}.templates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.template{padding:12px 8px;border:1px solid var(--line);border-radius:10px;background:#0b1727;color:var(--muted)}.template.active{border-color:var(--gold);color:var(--gold);background:#382a1533}.preview-wrap{position:sticky;top:18px}.canvas-box{min-height:500px;display:grid;place-items:center;background:#050b13;border-radius:14px;padding:14px;border:1px solid #243a53}.canvas-box canvas{max-width:100%;max-height:70vh;border-radius:8px;box-shadow:0 10px 35px #0008}.preview-tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.hint{color:var(--muted);font-size:12px}.status{margin-top:12px;min-height:20px;color:var(--accent)}.history{margin-top:20px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #1c3046}.row span{color:var(--muted)}@media(max-width:1000px){.layout{grid-template-columns:1fr}.preview-wrap{position:static}.canvas-box canvas{max-height:none}}@media(max-width:600px){.shell{padding:12px}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.grid{grid-template-columns:1fr}.templates{grid-template-columns:repeat(2,1fr)}.card{padding:14px}.canvas-box{min-height:320px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="mark">XP</div><div><h1>销售战报中心</h1><p>Sales Victory Studio · V1.0</p></div></div><div class="actions"><button class="btn" id="reset">重置</button><button class="btn" id="copyImage">复制图片</button><button class="btn" id="save">保存战报</button><button class="btn primary" id="download">下载 PNG</button></div></header><div class="layout"><section class="card"><div class="section"><h2>出单英雄</h2><div class="employees" id="employees"></div></div><div class="section grid"><div class="field"><label>开单金额</label><input id="amount" type="number" min="0" step="0.01" value="1000"></div><div class="field"><label>币种</label><select id="currency"><option>USD</option><option>RMB</option></select></div><div class="field"><label>累积金额</label><input id="cumulativeAmount" type="number" min="0" step="0.01" value="1000"></div><div class="field"><label>累积币种</label><select id="cumulativeCurrency"><option>USD</option><option>RMB</option></select></div><div class="field"><label>客户类型</label><select id="customer"><option>新客户</option><option>老客户</option></select></div><div class="field"><label>战报日期</label><input id="date" type="date"></div></div><div class="section"><h2>画布比例</h2><div class="actions" id="ratios"><button class="btn" data-ratio="portrait">竖版 1080×1440</button><button class="btn" data-ratio="square">方形 1200×1200</button><button class="btn" data-ratio="landscape">横版 1600×900</button></div></div><div class="section"><h2>战报模板</h2><div class="templates" id="templates"></div></div><div class="section grid"><div class="field"><label>订单截图</label><input id="screenshot" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="field"><label>截图适配</label><select id="fit"><option value="cover">智能铺满</option><option value="contain">完整显示</option></select></div></div><div class="section"><h2>开单文案</h2><textarea id="copyText" rows="7"></textarea><div class="preview-tools"><button class="btn" id="newCopy">生成新文案</button><button class="btn" id="copyTextBtn">复制文案</button></div></div><div class="field"><label>管理员密钥（仅保存/删除需要，浏览器不会自动提交到第三方）</label><input id="adminKey" type="password" autocomplete="off" placeholder="x-admin-key"></div><div class="status" id="status"></div></section><aside class="card preview-wrap"><h2>实时预览</h2><div class="canvas-box"><canvas id="canvas"></canvas></div><p class="hint">生成、保存、下载均复用同一 Canvas；截图只在提交保存时传输。</p><div class="history"><h2>最近战报</h2><div id="history"><span class="hint">加载中…</span></div></div></aside></div></main><script>
const themes={emeraldLaurel:['翡翠荣耀','#073b34','#42e0b0'],techBlue:['科技蓝光','#061d4a','#50b7ff'],luxuryBlack:['鎏金荣耀','#21150a','#f5c96b'],flameRed:['烈焰战魂','#4b1114','#ff806d'],auroraMint:['极光星海','#092f3a','#76f5d2'],nebulaViolet:['紫曜银河','#281450','#d09aff'],glacierSilver:['冰川银辉','#223344','#dcefff'],roseObsidian:['玫瑰曜石','#3a1729','#ff9cc4']};
const ratioSize={portrait:[1080,1440],square:[1200,1200],landscape:[1600,900]};let s={employee:null,employees:[],amount:'1000',currency:'USD',cumulativeAmount:'1000',cumulativeCurrency:'USD',customer:'新客户',date:new Date().toISOString().slice(0,10),ratio:'landscape',theme:'emeraldLaurel',fit:'cover',screenshot:null,screenshotName:'',copyVersion:0};
const $=id=>document.getElementById(id), api=async(path,opt={})=>{const r=await fetch('/api/'+path,{cache:'no-store',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok)throw Error(p.error||'请求失败');return p};
function money(v,c){return `${c==='USD'?'$':'¥'}${Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`};function rmb(v,c){return Number(v||0)*(c==='USD'?6.7:1)}
function makeCopy(){const date=s.date&&/^\d{4}-\d{2}-\d{2}$/.test(s.date)?new Date(`${s.date}T00:00:00`):new Date();const month=date.getMonth()+1;return `🔥【AI大赢家】🔥\n🌟 出单英雄：${s.employee?.name||'销售英雄'}\n💰 本次出单：RMB ${rmb(s.amount,s.currency).toLocaleString('zh-CN',{minimumFractionDigits:2})}\n⚡ 累积金额：RMB ${rmb(s.cumulativeAmount,s.cumulativeCurrency).toLocaleString('zh-CN',{minimumFractionDigits:2})}\n🤗 客户性质：${s.customer}\n\n火力全开，再创佳绩！\n热烈恭喜 ${s.employee?.name||'销售英雄'} 成功拿下${month}月${s.customer}订单，信任再加码！🔥\n保持冲锋姿态，向着更高目标全力冲刺！🚀`}
function draw(){const [w,h]=ratioSize[s.ratio];const c=$('canvas'),x=c.getContext('2d');c.width=w;c.height=h;const [label,bg,accent]=themes[s.theme];x.fillStyle=bg;x.fillRect(0,0,w,h);const g=x.createRadialGradient(w*.75,h*.2,20,w*.75,h*.2,w*.8);g.addColorStop(0,accent+'99');g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(0,0,w,h);x.strokeStyle=accent;x.lineWidth=Math.max(5,w/250);x.strokeRect(w*.035,h*.035,w*.93,h*.93);x.fillStyle='#ffffff';x.font=`900 ${w/17}px system-ui`;x.fillText('XPBS',w*.08,h*.15);x.fillStyle=accent;x.font=`700 ${w/38}px system-ui`;x.fillText('VICTORY BULLETIN',w*.08,h*.2);x.fillStyle='#fff';x.font=`900 ${w/15}px system-ui`;x.fillText(label,w*.08,h*.35);x.font=`800 ${w/21}px system-ui`;x.fillText(s.employee?.name||'销售英雄',w*.08,h*.45);x.fillStyle=accent;x.font=`900 ${w/13}px system-ui`;x.fillText(money(s.amount,s.currency),w*.08,h*.6);x.fillStyle='#dce9f4';x.font=`600 ${w/29}px system-ui`;x.fillText(`累计 ${money(s.cumulativeAmount,s.cumulativeCurrency)} · ${s.customer}`,w*.08,h*.68);x.fillText(s.date,w*.08,h*.75);if(s.screenshot){const iw=s.screenshot.naturalWidth,ih=s.screenshot.naturalHeight,boxW=w*.3,boxH=h*.38,scale=s.fit==='contain'?Math.min(boxW/iw,boxH/ih):Math.max(boxW/iw,boxH/ih),dw=iw*scale,dh=ih*scale;x.save();x.beginPath();x.roundRect(w*.62,h*.3,boxW,boxH,20);x.clip();x.drawImage(s.screenshot,w*.62+(boxW-dw)/2,h*.3+(boxH-dh)/2,dw,dh);x.restore()} }
function render(){const e=$('employees');e.innerHTML=s.employees.map(v=>`<button class="employee ${s.employee?.id===v.id?'active':''}" data-id="${v.id}">${v.name}<small>销售英雄</small></button>`).join('');e.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{s.employee=s.employees.find(v=>v.id===b.dataset.id);render();draw();});$('templates').innerHTML=Object.entries(themes).map(([k,v])=>`<button class="template ${s.theme===k?'active':''}" data-theme="${k}">${v[0]}</button>`).join('');$('templates').querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{s.theme=b.dataset.theme;render();draw();});$('copyText').value=makeCopy();document.querySelectorAll('#ratios [data-ratio]').forEach(b=>{b.classList.toggle('primary',b.dataset.ratio===s.ratio);b.onclick=()=>{s.ratio=b.dataset.ratio;render();draw()}})}
function sync(){['amount','currency','cumulativeAmount','cumulativeCurrency','customer','date','fit'].forEach(k=>{const el=$(k);if(k==='date'&&!el.value){el.value=s.date||new Date().toISOString().slice(0,10)}s[k]=el.value;el.oninput=()=>{s[k]=el.value||new Date().toISOString().slice(0,10);draw();$('copyText').value=makeCopy()}})}
async function blobData(){return new Promise((ok,no)=>$('canvas').toBlob(b=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)},'image/png'))}
async function saveReport(){const key=$('adminKey').value;if(!key)return setStatus('保存需要管理员密钥');setStatus('正在保存…');try{const imageData=await blobData();await api('reports',{method:'POST',headers:{'x-admin-key':key},body:JSON.stringify({employeeId:s.employee?.id,employeeName:s.employee?.name,amount:s.amount,currency:s.currency,amountRmb:rmb(s.amount,s.currency),cumulativeAmount:s.cumulativeAmount,cumulativeCurrency:s.cumulativeCurrency,cumulativeRmb:rmb(s.cumulativeAmount,s.cumulativeCurrency),customer:s.customer,reportDate:s.date,ratio:s.ratio,theme:s.theme,screenshotName:s.screenshotName,copyText:$('copyText').value,imageData})});setStatus('战报已保存');loadHistory()}catch(e){setStatus(e.message)}}
function setStatus(t){$('status').textContent=t;setTimeout(()=>{$('status').textContent=''},4500)}
async function loadHistory(){try{const rows=await api('reports?limit=8');$('history').innerHTML=rows.length?rows.map(x=>`<div class="row"><b>${x.employeeName||'—'}</b><span>${x.reportDate||''} · ${money(x.amount,x.currency)}</span></div>`).join(''):'<span class="hint">暂无历史战报</span>'}catch(e){$('history').textContent=e.message}}
$('download').onclick=async()=>{const a=document.createElement('a');a.href=await blobData();a.download=`销售战报中心战报-${s.employee?.name||'英雄'}-${s.date.replaceAll('-','')}.png`;a.click();await saveReport()};$('save').onclick=saveReport;$('copyImage').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':await new Promise(r=>$('canvas').toBlob(r,'image/png'))})]);setStatus('战报图片已复制')}catch{setStatus('当前浏览器不支持图片复制，请下载 PNG')}};$('copyTextBtn').onclick=async()=>{await navigator.clipboard.writeText($('copyText').value);setStatus('文案已复制')};$('newCopy').onclick=()=>{$('copyText').value=makeCopy();setStatus('已生成新文案')};$('reset').onclick=()=>location.reload();$('screenshot').onchange=e=>{const f=e.target.files[0];if(!f)return;s.screenshotName=f.name;const im=new Image();im.onload=()=>{s.screenshot=im;draw()};im.src=URL.createObjectURL(f)};
(async()=>{try{s.employees=await api('employees');s.employee=s.employees[0]}catch(e){setStatus(e.message)}sync();render();draw();loadHistory()})();
</script></body></html>
